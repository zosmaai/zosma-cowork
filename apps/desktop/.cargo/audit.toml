# cargo-audit configuration
#
# RUSTSEC-2026-0235 — rkyv 0.7.46 archive validation bypass (memory-exposure).
# Transitive via: tauri-plugin-log -> byte-unit -> rust_decimal -> rkyv 0.7.46
# Fixed in rkyv >= 0.8.17, but rust_decimal's rkyv feature still pins 0.7.
# We don't archive/validate untrusted rkyv data in zosma-cowork — the Tauri
# log plugin only measures byte units. Bumping requires rust_decimal ->
# rkyv 0.8 migration. Ignore until upstream moves.
#
# RUSTSEC-2026-0194/0195 — quick-xml DoS (quadratic / memory exhaustion).
# Transitive via Tauri stack (tauri-winrt-notification 0.37.5 and bundler 0.39.2).
# Fixed in quick-xml >= 0.41.0; needs Tauri upgrade. Not exploitable — we
# don't parse untrusted XML. TODO: remove once Tauri pulls >=0.41.0.
[advisories]
ignore = ["RUSTSEC-2026-0194", "RUSTSEC-2026-0195", "RUSTSEC-2026-0235"]
