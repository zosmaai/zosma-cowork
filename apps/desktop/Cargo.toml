[package]
name = "zosma-cowork"
version = "0.3.0"
description = "Zosma Cowork — thin Tauri shell around the Zosma Harness web UI"
authors = ["zosmaai"]
edition = "2021"
rust-version = "1.85"
license = "Proprietary"
repository = "https://github.com/zosmaai/zosma-cowork"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.dev]
# Faster incremental rebuilds during development.
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
