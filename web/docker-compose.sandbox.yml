services:
  cowork:
    build:
      context: .
      dockerfile: Dockerfile
    image: zosma-cowork:local
    ports:
      - "30141:30141"
    # Tailscale needs a TUN device + net admin privileges to run its daemon.
    devices:
      - "/dev/net/tun:/dev/net/tun:crw-rw-rw-"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      PORT: "30141"
      # IANA zone name, e.g. America/New_York. Set to override container TZ.
      TZ: "${TZ:-UTC}"
      HOSTNAME: "0.0.0.0"
      PI_WEB_HOSTNAME: "0.0.0.0"
      # Allow LAN access via the host's machine name (see web/lib/request-security.ts).
      # The browser sends `Host: omarchy:30141`, so this must list the reachable name.
      PI_WEB_ALLOWED_HOSTS: "omarchy"
      PI_CODING_AGENT_DIR: "/data/pi-agent"
      PI_WEB_PASSWORD: "${PI_WEB_PASSWORD:-}"
      ZOSMA_AUTH_BASE_URL: "${ZOSMA_AUTH_BASE_URL:-}"
      ZOSMA_ROUTER_BASE_URL: "${ZOSMA_ROUTER_BASE_URL:-}"
    volumes:
      - pi-data:/data/pi-agent
    restart: unless-stopped

volumes:
  pi-data:
