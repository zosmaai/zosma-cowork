name: zosma-cowork
services:
  zosma-cowork:
    build:
      context: .
      dockerfile: Dockerfile
    image: zosma-cowork:local
    container_name: ${CONTAINER_NAME:-zosma-cowork}
    ports:
      # Host port is per-brand (demo → 30141, nandi → 30142, ...).
      # The in-container port stays 30141; only the host side maps per brand.
      - "${HOST_PORT:-30141}:30141"
    # Tailscale needs a TUN device + net admin privileges to run its daemon.
    devices:
      - "/dev/net/tun:/dev/net/tun:crw-rw-rw-"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      PORT: "30141"
      # IANA zone name, e.g. America/New_York. Set to override container TZ.
      TZ: "${TZ:-UTC}"
      HOSTNAME: "0.0.0.0"
      PI_WEB_HOSTNAME: "0.0.0.0"
      # Exact hostnames the browser may use (domain + machine/IP fallback).
      # Per-brand, set: PI_WEB_ALLOWED_HOSTS=demo.zosma.ai,localhost
      PI_WEB_ALLOWED_HOSTS: ${PI_WEB_ALLOWED_HOSTS:-localhost}
      # One PVC mounted at /persistent; Pi sees its home at /home/user while
      # the mutable Alpine system remains separately organized under rootfs/.
      PI_CODING_AGENT_DIR: /home/user/.pi/agent
      PI_PROJECT_SHELL_PATH: /usr/local/bin/pi-shell
      PI_PERSISTENT_HOME: /persistent/home
      PI_PERSISTENT_ROOTFS: /persistent/rootfs
      PI_WEB_PASSWORD: ${PI_WEB_PASSWORD:-}
      ZOSMA_AUTH_BASE_URL: ${ZOSMA_AUTH_BASE_URL:-}
      ZOSMA_ROUTER_BASE_URL: ${ZOSMA_ROUTER_BASE_URL:-}
    volumes:
      # Exactly one persistent mount/PVC per brand. Its home/, rootfs/, and
      # state/ children have separate lifecycle meaning without extra mounts.
      # Use an absolute host path; refusing an unset value prevents accidental
      # state creation in a repo checkout or under sudo's /root HOME.
      - ${PI_PERSISTENT_DIR:?Set PI_PERSISTENT_DIR in web/.env}:/persistent
    restart: unless-stopped
