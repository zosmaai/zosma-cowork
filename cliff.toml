# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Zosma Cowork are documented here.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.github.pr_number %} ([#{{ commit.github.pr_number }}](https://github.com/zosmaai/zosma-cowork/pull/{{ commit.github.pr_number }})){% endif %}\
    {% endfor %}
{% endfor %}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = false
# Postprocessors to modify the changelog after rendering.
postprocessors = [
    { pattern = '\(#(\d+)\)', replace = "([#$1](https://github.com/zosmaai/zosma-cowork/pull/$1))" },
]
# Output file path (empty = stdout)
# output = "CHANGELOG.md"

[git]
# Parse commits according to the conventional commits specification.
conventional_commits = true
# Filter out non-conventional commits.
filter_unconventional = true
# Require all commits to be conventional. Off by default — we have merge commits.
require_conventional = false
# Split commits on newlines.
split_commits = false
# Only match v-prefixed version tags (skip non-version tags like
# "screenshots-bug-reports" and "image-hosting").
tag_pattern = "v[0-9]*"
# Skip tags that are certainly not releases.
skip_tags = "screenshots-bug-reports|image-hosting"
# Preprocessors to modify commit messages before parsing.
commit_preprocessors = [
    # Trim trailing whitespace from PR references
    { pattern = ' \(\(#(\d+)\)\)', replace = " (#$1)" },
]
# Prevent breaking commits from being excluded by parsers.
protect_breaking_commits = true
# Commit parsers — map conventional commit types to changelog groups.
# The <!-- N --> comments control sort order and are stripped at render time.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->🚀 Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^refactor", group = "<!-- 2 -->🔄 Refactor" },
    { message = "^doc", group = "<!-- 3 -->📖 Documentation" },
    { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Maintenance" },
    { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
    { message = "^revert", group = "<!-- 9 -->⏪ Reverts" },
    # Merge commits and anything else fall here. Conventional-only repos
    # should never hit this — but we keep it as a safety net.
    { message = ".*", group = "<!-- 10 -->📦 Other" },
]
# Don't filter unmatched commits — they fall into the catch-all group.
filter_commits = false
# Don't fail on unmatched commits either.
fail_on_unmatched_commit = false
# Link parsers for external references.
link_parsers = [
    # Turn #123 into an issue link
    { pattern = "#(\\d+)", href = "https://github.com/zosmaai/zosma-cowork/issues/$1" },
]
# Only include tags from the current branch.
use_branch_tags = false
# Order releases topologically (by tag ancestry, not chronologically by date).
topo_order = true
# Order commits topologically within each release.
topo_order_commits = true
# Sort commits oldest-first within each group.
sort_commits = "oldest"
