name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Port contract guard
        # SHARED_PORT (shell) and the next scripts (web) must agree on 30141.
        run: node scripts/check-shared-port.mjs

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build daemon
        run: pnpm daemon:build

  docs:
    name: Docs Site Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: pnpm build

  tauri:
    name: Tauri Shell Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled Node.js binary
        # tauri.conf.json's bundle.resources declares binaries/node*, so the
        # build script needs it at compile time (the binary itself is
        # generated at build time by fetch-node.mjs).
        run: node apps/desktop/scripts/fetch-node.mjs

      - name: Build web server (standalone dist-server resource)
        # tauri.conf.json's bundle.resources also declares the packaged web
        # server, so compile-time resource validation needs it.
        run: |
          pnpm -C apps/web build
          pnpm -C apps/web package-server

      - name: Setup Rust
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain stable -y
          fi
          rustup toolchain install stable --component rustfmt --component clippy --no-self-update
          rustup default stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format check
        working-directory: apps/desktop
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: apps/desktop
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build check
        working-directory: apps/desktop
        run: cargo build --workspace

  server-artifact:
    name: Server artifact (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup build Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server unit and daemon tests
        run: |
          pnpm test:server
          pnpm -C apps/daemon test
          pnpm -C apps/daemon typecheck

      - name: Package host archive
        run: pnpm server:package --target "${{ matrix.target }}" --version v0.0.0-ci

      - name: Verify archive checksum
        working-directory: dist/server
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check SHA256SUMS
          else
            shasum -a 256 --check SHA256SUMS
          fi

      - name: Smoke extracted archive
        shell: bash
        run: |
          archive="dist/server/zosma-cowork-server-v0.0.0-ci-${{ matrix.target }}.tar.gz"
          pnpm server:smoke --archive "$archive"

      - name: Debian 12 compatibility smoke
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          archive="dist/server/zosma-cowork-server-v0.0.0-ci-linux-x64.tar.gz"
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          tar -xzf "$archive" -C "$temp"
          docker run --rm --network host \
            -v "$PWD:/repo" -v "$temp:$temp:ro" -w /repo debian:12-slim \
            "$temp/runtime/bin/node" scripts/smoke-server-release.mjs --archive "$archive"

  docker:
    name: Production Docker image
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Verify Docker and Compose contracts
        run: pnpm test:docker

      - name: Build local image
        run: |
          docker build \
            --build-arg ZOSMA_VERSION=v0.0.0-ci \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag zosma-cowork:ci \
            .

      - name: Smoke loopback mode
        run: pnpm docker:smoke --image zosma-cowork:ci --bind 127.0.0.1

      - name: Smoke LAN mode
        run: pnpm docker:smoke --image zosma-cowork:ci --bind 0.0.0.0
