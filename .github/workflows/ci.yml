name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web UI Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Port contract guard
        # SHARED_PORT (shell) and the next scripts (web) must agree on 30141.
        run: node scripts/check-shared-port.mjs

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build daemon
        run: pnpm daemon:build

  docs:
    name: Docs Site Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: pnpm build

  tauri:
    name: Tauri Shell Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled Node.js binary
        # tauri.conf.json's bundle.resources declares binaries/node*, so the
        # build script needs it at compile time (the binary itself is
        # generated at build time by fetch-node.mjs).
        run: node apps/desktop/scripts/fetch-node.mjs

      - name: Build web server (standalone dist-server resource)
        # tauri.conf.json's bundle.resources also declares the packaged web
        # server, so compile-time resource validation needs it.
        run: |
          pnpm -C apps/web build
          pnpm -C apps/web package-server

      - name: Setup Rust
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain stable -y
          fi
          rustup toolchain install stable --component rustfmt --component clippy --no-self-update
          rustup default stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Format check
        working-directory: apps/desktop
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: apps/desktop
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build check
        working-directory: apps/desktop
        run: cargo build --workspace
