name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday

jobs:
  secret-boundary:
    name: Secret boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tracked credential files and common key patterns
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files | grep -Ei '(^|/)(\.env$|client[_-]?secret($|\.)|credentials?($|\.)|.*secret.*\.json$)' || true)
          if [ -n "$tracked" ]; then
            echo "Tracked credential-like files found:"
            echo "$tracked"
            exit 1
          fi
          matches=$(git grep -nI -E 'GOCSPX-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}' -- ':!*.md' ':!*.example' ':!*.test.*' || true)
          if [ -n "$matches" ]; then
            echo "Credential-shaped values found in tracked source:"
            echo "$matches"
            exit 1
          fi

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Fail on any moderate-or-higher workspace advisory.
      - name: Audit workspace dependencies
        run: npx audit-ci --config audit-ci.jsonc

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - name: Audit desktop dependencies
        working-directory: apps/desktop
        run: cargo audit

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: typescript, rust
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
